description: >-
  FinOps view of OpenStatus spend. OpenStatus Cloud bills on flat monthly (or
  discounted annual) subscriptions per tier (Hobby free, Starter $30, Pro $100,
  Scale $500, Enterprise custom), plus a recurring +$20/mo charge per status
  page beyond the plan allowance. There is no per-request token metering; cost
  is driven by which tier provides the required monitor count, check frequency,
  region coverage, and retention. Self-hosting under AGPL-3.0 carries no license
  fee and shifts cost to the operator's own compute, storage, and egress.
notes: >-
  Subscription prices and per-page add-on rates are subject to change; verify
  against the OpenStatus pricing page during reconciliation.
