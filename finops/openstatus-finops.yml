meters:
- name: subscription_fee
  description: Flat monthly or annual subscription fee for the selected plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - workspace
  - plan
- name: additional_status_pages
  description: Recurring +$20/mo charge per status page beyond the plan allowance.
  unit: pages
  aggregation: sum
  dimensions:
  - workspace
  - plan
- name: monitors
  description: Number of active monitors against the plan allowance.
  unit: monitors
  aggregation: max
  dimensions:
  - workspace
- name: regions
  description: Number of probe regions in use per monitor against the plan allowance.
  unit: regions
  aggregation: max
  dimensions:
  - workspace
  - monitor
- name: self_hosted_infrastructure
  description: Operator-borne compute, storage, and egress for self-hosted AGPL-3.0 deployments.
  unit: infrastructure
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track which plan tier each workspace is on and whether monitor, page, region, and retention usage justifies it.
- name: Allocation
  description: Map subscription and per-page charges to the teams or services whose monitors and status pages drive them.
- name: Optimization
  description: Right-size the plan tier to required check frequency and region coverage; consolidate status pages; self-host under AGPL-3.0 when infrastructure cost beats subscription cost.
- name: Accountability
  description: Assign an owner per workspace; review subscription and add-on spend against monitoring needs each billing cycle.
