aid: openstatus
url: https://raw.githubusercontent.com/api-evangelist/openstatus/refs/heads/main/apis.yml
name: OpenStatus
kind: company
description: OpenStatus is an open-source synthetic monitoring and status-page platform.
  It runs HTTP, TCP, and DNS uptime checks from 28 global regions, publishes hosted
  and self-hostable status pages, and manages incidents and status reports. The OpenStatus
  REST API at https://api.openstatus.dev/v1 lets teams programmatically manage monitors,
  status pages, status reports, incidents, and on-demand checks. The platform is free
  to self-host (AGPL-3.0) and also available as a managed cloud service.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Monitoring
- Synthetic Monitoring
- Uptime
- Status Pages
- Incidents
- Open Source
- Observability
created: '2026-06-21'
modified: '2026-06-21'
