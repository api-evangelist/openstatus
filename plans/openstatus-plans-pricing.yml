- Status Pages
- Incidents
- Open Source
- Plans
description: >-
  OpenStatus is dual-distributed. The full platform is open source under
  AGPL-3.0 and can be self-hosted at no license cost. OpenStatus Cloud is a
  managed SaaS with a free Hobby tier plus flat monthly Starter, Pro, and Scale
  subscriptions and a custom Enterprise tier. Paid tiers differ primarily by
  number of monitors, minimum check frequency, number of status pages and
  components, available regions, data retention, and notification channels.
  The same REST API is available across hosted plans.
notes: >-
  Annual billing saves two months versus monthly. Additional status pages on
  paid plans are +$20/mo each. Verify current limits and prices on the
  OpenStatus pricing page during reconciliation.
sources:
- https://www.openstatus.dev/pricing
- https://www.openstatus.dev/docs
- https://github.com/openstatusHQ/openstatus
